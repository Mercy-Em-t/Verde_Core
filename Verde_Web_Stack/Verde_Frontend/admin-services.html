<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services Hub | Verde Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .sidebar { background-color: #0B1325; color: white; min-height: 100vh; }
    </style>
</head>
<body class="flex">

    <!-- Sidebar -->
    <aside class="sidebar w-64 p-6 hidden md:block flex-shrink-0 flex flex-col">
        <div class="flex items-center space-x-3 mb-10">
            <div class="bg-indigo-600 text-white font-bold p-2 rounded w-8 h-8 flex items-center justify-center">TM</div>
            <div>
                <span class="text-sm font-bold tracking-wider block">Tryphene Murugat</span>
                <span class="text-[10px] text-emerald-400 font-bold uppercase tracking-widest"><i class="fa-solid fa-code-branch mr-1"></i> Orchestrator Mode</span>
            </div>
        </div>
        
        <nav class="flex-1 space-y-6 text-sm font-medium">
            <div class="space-y-1">
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Business Dev</h2>
                <ul class="space-y-1">
                    <li><a href="admin.html" class="flex items-center space-x-2 px-3 py-2 rounded text-sm hover:bg-slate-800 transition"><i class="fa-solid fa-chart-line w-5 text-center"></i> <span>Global HUD</span></a></li>
                    <li><a href="admin-leads.html" class="flex items-center space-x-2 px-3 py-2 rounded text-sm hover:bg-slate-800 transition"><i class="fa-solid fa-funnel-dollar w-5 text-center"></i> <span>Lead Qualifiers</span></a></li>
                    <li><a href="admin-services.html" class="flex items-center space-x-2 px-3 py-2 rounded text-sm hover:bg-slate-800 transition text-emerald-400 bg-slate-800"><i class="fa-solid fa-layer-group w-5 text-center"></i> <span>Services Catalog</span></a></li>
                    <li><a href="admin-portfolio.html" class="flex items-center space-x-2 px-3 py-2 rounded text-sm hover:bg-slate-800 transition text-indigo-400"><i class="fa-solid fa-images w-5 text-center"></i> <span>Portfolio Matrix</span></a></li>
                </ul>
            </div>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto">
        <header class="bg-white border-b border-slate-200 px-8 py-5 flex justify-between items-center sticky top-0 z-10">
            <h1 class="text-2xl font-bold text-[#0B1325]">Services Catalog Hub</h1>
            <button onclick="document.getElementById('serviceModal').classList.remove('hidden'); document.getElementById('modalTitle').innerText='Create New Service'; document.getElementById('serviceForm').reset(); document.getElementById('serviceId').value='';" class="bg-indigo-600 text-white px-4 py-2 rounded font-bold text-sm hover:bg-indigo-700 transition">
                <i class="fa-solid fa-plus mr-2"></i> Add Service
            </button>
        </header>

        <div class="p-8 max-w-5xl">
            <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-500 font-bold">
                        <tr>
                            <th class="px-6 py-4">Service Name</th>
                            <th class="px-6 py-4">Description</th>
                            <th class="px-6 py-4">Price (KES)</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="servicesList" class="divide-y divide-slate-100">
                        <tr><td colspan="5" class="px-6 py-8 text-center text-slate-400">Loading services...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Service Modal -->
    <div id="serviceModal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 z-50 flex justify-center items-center backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden border border-slate-200">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="text-lg font-bold text-slate-800" id="modalTitle">Create Service</h3>
                <button onclick="document.getElementById('serviceModal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6">
                <form id="serviceForm" onsubmit="saveService(event)">
                    <input type="hidden" id="serviceId">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Service Name</label>
                            <input type="text" id="svcName" required class="w-full border-slate-300 rounded focus:ring-indigo-500 focus:border-indigo-500 text-sm p-2 border">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Description</label>
                            <textarea id="svcDesc" required rows="3" class="w-full border-slate-300 rounded focus:ring-indigo-500 focus:border-indigo-500 text-sm p-2 border"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Price (KES)</label>
                            <input type="number" id="svcPrice" required class="w-full border-slate-300 rounded focus:ring-indigo-500 focus:border-indigo-500 text-sm p-2 border">
                        </div>
                        <div id="statusToggle" class="hidden items-center space-x-2 pt-2">
                            <input type="checkbox" id="svcActive" class="rounded text-indigo-600 focus:ring-indigo-500">
                            <label class="text-sm font-bold text-slate-700">Service is Active</label>
                        </div>
                    </div>
                    <div class="mt-6 flex justify-end space-x-3">
                        <button type="button" onclick="document.getElementById('serviceModal').classList.add('hidden')" class="px-4 py-2 text-slate-600 text-sm font-bold hover:bg-slate-100 rounded transition">Cancel</button>
                        <button type="submit" class="px-6 py-2 bg-indigo-600 text-white text-sm font-bold rounded shadow hover:bg-indigo-700 transition">Save Service</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="api-client.js"></script>
    <script>
        const token = localStorage.getItem('verde_api_token');
        if (!token) window.location.href = 'login.html';
        
        let localServices = [];

        async function loadServices() {
            try {
                const res = await window.TMAPI.adminDashboard('services');
                localServices = res.services || res.data || res || []; if(!Array.isArray(localServices)) localServices = Object.values(localServices); if(!Array.isArray(localServices)) localServices = [];
                renderServices();
            } catch (e) {
                console.error(e);
                document.getElementById('servicesList').innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-red-500 font-bold">Error loading services.</td></tr>`;
            }
        }

        function renderServices() {
            const tbody = document.getElementById('servicesList');
            if(localServices.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-slate-400 font-medium">No services found. Add one above.</td></tr>`;
                return;
            }
            
            tbody.innerHTML = localServices.map(s => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="px-6 py-4 font-bold text-slate-800">${s.name}</td>
                    <td class="px-6 py-4 text-slate-500 truncate max-w-xs">${s.description}</td>
                    <td class="px-6 py-4 font-mono">KES ${s.price.toLocaleString()}</td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 rounded text-xs font-bold uppercase ${s.is_active ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${s.is_active ? 'Active' : 'Inactive'}</span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="editService(${s.id})" class="text-indigo-600 hover:text-indigo-900 font-bold text-sm"><i class="fa-solid fa-pen-to-square mr-1"></i> Edit</button>
                    </td>
                </tr>
            `).join('');
        }

        function editService(id) {
            const svc = localServices.find(s => s.id === id);
            if(!svc) return;
            document.getElementById('modalTitle').innerText = 'Edit Service';
            document.getElementById('serviceId').value = svc.id;
            document.getElementById('svcName').value = svc.name;
            document.getElementById('svcDesc').value = svc.description;
            document.getElementById('svcPrice').value = svc.price;
            document.getElementById('svcActive').checked = svc.is_active;
            document.getElementById('statusToggle').classList.remove('hidden');
            document.getElementById('statusToggle').classList.add('flex');
            document.getElementById('serviceModal').classList.remove('hidden');
        }

        async function saveService(e) {
            e.preventDefault();
            const id = document.getElementById('serviceId').value;
            const payload = {
                name: document.getElementById('svcName').value,
                description: document.getElementById('svcDesc').value,
                price: parseFloat(document.getElementById('svcPrice').value),
                is_active: id ? document.getElementById('svcActive').checked : true
            };
            
            try {
                
                const endpoint = id ? 'http://127.0.0.1:8081/api/admin/services/' + id : 'http://127.0.0.1:8081/api/admin/services';
                const method = id ? 'PATCH' : 'POST';
                const token = localStorage.getItem('verde_api_token');
                
                const response = await fetch(endpoint, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'API Error');
                }
    
                document.getElementById('serviceModal').classList.add('hidden');
                loadServices(); // reload
            } catch (err) {
                alert("Error saving service");
                console.error(err);
            }
        }

        document.addEventListener('DOMContentLoaded', loadServices);
    </script>
</body>
</html>
