<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tryphen | Financial Control</title><style>body{margin:0;background:#F8FAFC;color:#0B1325;font:14px/1.5 Inter,system-ui,sans-serif}.top{background:#0B1325;color:white;padding:20px}.wrap{max-width:1180px;margin:auto;padding:24px 18px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.btn{border:1px solid #CBD5E1;background:white;border-radius:8px;padding:9px 12px;cursor:pointer}.primary{background:#0B1325;color:#fff;border-color:#0B1325}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:white;border:1px solid #CBD5E1;border-radius:10px;padding:16px;margin-bottom:14px}.stat b{font-size:24px}.muted{color:#64748B}.pill{display:inline-block;background:#EFF6FF;color:#1E40AF;padding:3px 8px;border-radius:99px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input,.row select,.row textarea{padding:8px;border:1px solid #CBD5E1;border-radius:7px}.row textarea{min-height:70px;width:100%}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #E2E8F0}.money{font-variant-numeric:tabular-nums}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}table{font-size:12px}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><script>
  const verde_api_token = localStorage.getItem('verde_api_token');
  const tm_user = JSON.parse(localStorage.getItem('tm_user') || 'null');
  if (!verde_api_token || !tm_user || (tm_user.role !== 'admin' && tm_user.role !== 'consultant')) {
    window.location.href = 'login.html';
  }
</script><div class="top"><strong>TRYPHEN EMURUGAT — FINANCIAL & COMMERCIAL CONTROL</strong><div style="opacity:.7">Fees · invoices · payments · change orders</div></div><main class="wrap"><div class="nav"><button class="btn" onclick="location.href='admin.html'">Operations</button><button class="btn" onclick="location.href='proposal.html'">Proposal</button><button class="btn" onclick="location.href='delivery.html'">Delivery</button><button class="btn" onclick="location.href='governance.html'">Governance</button></div><div id="app"></div></main><script src="workflow-guards.js"></script>
<script src="project-state.js"></script><script src="finance.js"></script><script src="proposal.js"></script><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=n=>new Intl.NumberFormat('en-KE',{style:'currency',currency:'KES',maximumFractionDigits:0}).format(Number(n||0));
function render(){const p=TM.get(),s=TMFIN.summary(p.id);const x=TMFIN.list();app.innerHTML=`<h1>Commercial control</h1><p class="muted">Project: <b>${esc(p.name)}</b> · ${esc(p.id)} · ${esc(p.status)}</p><div class="grid"><div class="card stat">Billed<br><b class="money">${money(s.billed)}</b></div><div class="card stat">Paid<br><b class="money">${money(s.paid)}</b></div><div class="card stat">Outstanding<br><b class="money">${money(s.outstanding)}</b></div><div class="card stat">Approved changes<br><b class="money">${money(s.approvedChanges)}</b></div></div><div class="card"><h2>Fee schedule</h2><div class="row"><button class="btn primary" onclick="makeSchedule()">Sync from approved proposal</button><button class="btn" onclick="showInvoiceForm()">Create invoice</button></div><table><tr><th>Milestone</th><th>Amount</th><th>Due rule</th><th>Status</th></tr>${x.schedules.filter(r=>!r.projectId||r.projectId===p.id).map(r=>`<tr><td>${esc(r.label)}</td><td class="money">${money(r.amount)}</td><td>${esc(r.dueRule)}</td><td><span class="pill">${esc(r.status)}</span></td></tr>`).join('')||'<tr><td colspan="4" class="muted">No fee schedule yet.</td></tr>'}</table></div><div class="card"><h2>Invoices</h2><div id="invoiceForm" class="hidden"></div><table><tr><th>Invoice</th><th>Description</th><th>Amount</th><th>Paid</th><th>Status</th><th></th></tr>${x.invoices.filter(i=>i.projectId===p.id).map(i=>`<tr><td>${esc(i.number)}</td><td>${esc(i.description)}</td><td class="money">${money(i.amount)}</td><td class="money">${money(i.paid)}</td><td>${esc(i.status)}</td><td>${i.status==='Draft'?`<button class="btn" onclick="issueInv('${i.id}')">Issue</button>`:''}<button class="btn" onclick="paymentForm('${i.id}')">Record payment</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No invoices.</td></tr>'}</table><div id="payForm"></div></div><div class="card"><h2>Change orders</h2><div class="row"><input id="coTitle" placeholder="Change title"><input id="coAmount" type="number" placeholder="Amount (KES)"><button class="btn primary" onclick="addChange()">Create change request</button></div><table><tr><th>Change</th><th>Amount</th><th>Status</th><th>Action</th></tr>${x.changes.filter(c=>c.projectId===p.id).map(c=>`<tr><td>${esc(c.title)}<br><span class="muted">${esc(c.description)}</span></td><td class="money">${money(c.amount)}</td><td>${esc(c.status)}</td><td>${c.status==='Draft'||c.status==='Submitted'?`<button class="btn" onclick="setChange('${c.id}','Submitted')">Submit</button> <button class="btn" onclick="setChange('${c.id}','Approved')">Approve</button> <button class="btn" onclick="setChange('${c.id}','Declined')">Decline</button>`:''}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No change orders.</td></tr>'}</table></div><div class="card"><h2>Commercial history</h2>${x.history.slice().reverse().slice(0,20).map(h=>`<p>${new Date(h.at).toLocaleString()} · ${esc(h.text)}</p>`).join('')||'<p class="muted">No activity.</p>'}</div>`}
function makeSchedule(){const p=TM.get();const ps=TMPROPOSAL.list().find(x=>x.id===p.proposalId);if(!ps)return alert('No linked proposal found. Approve a proposal first.');TMFIN.activateFromProposal(ps);render()}
function showInvoiceForm(){invoiceForm.classList.remove('hidden');invoiceForm.innerHTML=`<div class="card"><div class="row"><input id="idesc" placeholder="Description" style="flex:2"><input id="iamt" type="number" placeholder="Amount (KES)"><input id="idue" type="date"><button class="btn primary" onclick="createInv()">Save invoice</button></div></div>`}
function createInv(){const p=TM.get();TMFIN.invoice({projectId:p.id,proposalId:p.proposalId||'',client:p.name,description:document.getElementById('idesc').value,amount:document.getElementById('iamt').value,dueDate:document.getElementById('idue').value});render()}
function issueInv(id){TMFIN.issue(id);render()}
function paymentForm(id){payForm.innerHTML=`<div class="card"><div class="row"><input id="pamt" type="number" placeholder="Payment amount"><input id="pref" placeholder="Reference"><input id="pdate" type="date"><button class="btn primary" onclick="savePay('${id}')">Record</button></div></div>`}
function savePay(id){TMFIN.payment({invoiceId:id,projectId:TM.get().id,amount:document.getElementById('pamt').value,reference:document.getElementById('pref').value,date:document.getElementById('pdate').value});render()}
function addChange(){const p=TM.get();const title=document.getElementById('coTitle').value.trim();if(!title)return;TMFIN.change({projectId:p.id,proposalId:p.proposalId||'',title,description:'Commercial change request',amount:document.getElementById('coAmount').value});render()}
function setChange(id,status){TMFIN.changeStatus(id,status);render()}render();
</script></body></html>
