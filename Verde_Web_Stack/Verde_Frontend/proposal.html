<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proposal | Tryphen Emurugat</title>
<style>body{margin:0;background:#f8fafc;color:#0b1325;font:14px/1.55 Inter,system-ui,sans-serif}.top{background:#0b1325;color:#fff;padding:20px}.wrap{max-width:1000px;margin:auto;padding:24px 18px}.card{background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}.primary{background:#0b1325;color:#fff}.pill{background:#eff6ff;color:#1e40af;border-radius:99px;padding:4px 9px}.muted{color:#64748b}.line{display:flex;justify-content:space-between;border-bottom:1px solid #e2e8f0;padding:10px 0}.total{font-size:22px;font-weight:800}.field{display:flex;flex-direction:column;gap:5px}.field input,.field textarea{padding:9px;border:1px solid #cbd5e1;border-radius:7px}.field textarea{min-height:80px}.check{margin:6px 0}.notice{background:#fffbeb;border:1px solid #fde68a;padding:12px;border-radius:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head>
<body><script>
  const verde_api_token = localStorage.getItem('verde_api_token');
  const tm_user = JSON.parse(localStorage.getItem('tm_user') || 'null');
  if (!verde_api_token || !tm_user || (tm_user.role !== 'admin' && tm_user.role !== 'consultant')) {
    window.location.href = 'login.html';
  }
</script><div class="top"><strong>TRYPHEN EMURUGAT — PROPOSAL BUILDER</strong><div style="opacity:.7">Turn a qualified opportunity into a clear commercial scope</div></div><main class="wrap"><div id="app"></div></main>
<script src="workflow-guards.js"></script>
<script src="project-state.js"></script><script src="proposal.js"></script><script src="engagement.js"></script><script>
const $=id=>document.getElementById(id); const money=n=>'KES '+Number(n||0).toLocaleString('en-KE');
let p=TMPROPOSAL.list().slice(-1)[0]||TMPROPOSAL.fromProject(TM.get(),TM.get().qualification||{});
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){p=TMPROPOSAL.get(p.id)||p; const items=p.items||[]; $('app').innerHTML=`<div class="row" style="justify-content:space-between"><div><h1>${esc(p.number)}</h1><span class="pill">${esc(p.status)}</span></div><div class="row"><button class="btn" onclick="window.location='admin.html'">Operations</button><button class="btn" onclick="window.location='my-project.html'">My Project</button></div></div>
<div class="card"><div class="grid"><div><b>Client</b><div>${esc(p.client)}</div><div class="muted">${esc(p.contact)} · ${esc(p.email)}</div></div><div><b>Proposal validity</b><div>${p.validDays} days</div><div class="muted">Created ${new Date(p.created).toLocaleDateString()}</div></div></div></div>
<div class="card"><h2>Scope and investment</h2>${items.length?items.map(x=>`<div class="line"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.gate)} · ${esc(x.scope)}</div></div><b>${money(x.price)}</b></div>`).join(''):'<div class="notice">No phases selected yet. Return to the project and select the phases that should be proposed.</div>'}<div class="line"><span>Subtotal</span><b>${money(p.subtotal)}</b></div><div class="line total"><span>Total indicative investment</span><span>${money(p.total)}</span></div></div>
<div class="grid"><div class="card"><h2>Client objective</h2><p>${esc(p.goal||'Objective to be confirmed during discovery.')}</p><h3>Assumptions</h3>${(p.assumptions||[]).map(x=>`<div class="check">✓ ${esc(x)}</div>`).join('')}</div><div class="card"><h2>Commercial terms</h2><p>${esc(p.paymentTerms)}</p><div class="field"><label>Proposal notes</label><textarea id="notes">${esc(p.notes)}</textarea></div><button class="btn" onclick="saveNotes()">Save notes</button></div></div>
<div class="card"><h2>Next step</h2><p>Review the scope, confirm any changes, then send the proposal for client approval. Once approved, it can be activated into the project journey.</p><div class="row"><button class="btn" onclick="setStatus('Sent')">Mark as sent</button><button class="btn" onclick="setStatus('Declined')">Mark declined</button><button class="btn primary" onclick="approve()">Record client approval</button>${p.status==='Approved'?'<button class="btn primary" onclick="activate()">Activate project</button>':''}</div></div>`}
function saveNotes(){p.notes=$('notes').value;TMPROPOSAL.save(p);render()}function setStatus(s){TMPROPOSAL.transition(p.id,s);render()}function approve(){const n=prompt('Name of client approver:','Client approver');if(n!==null){TMPROPOSAL.approve(p.id,n);render()}}function activate(){TMPROPOSAL.activate(p.id);alert('Proposal activated. The engagement workspace is ready.');location.href='delivery.html'}render();
</script></body></html>
