version: '3.8'

services:
  verde-sdlc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: verde-sdlc-production
    ports:
      - "3000:3000"
    volumes:
      - ./data:/usr/src/app/data
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://verde_admin:verde_secure_password@postgres:5432/verde_db?schema=public
      - JWT_SECRET=verde_super_secret_key_2026
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: verde-postgres
    environment:
      POSTGRES_USER: verde_admin
      POSTGRES_PASSWORD: verde_secure_password
      POSTGRES_DB: verde_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verde_admin -d verde_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
