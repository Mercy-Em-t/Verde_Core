<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Closeout & Outcomes</title><style>
:root{--navy:#071a33;--blue:#1769e0;--bg:#f5f7fb;--line:#dbe2ec;--muted:#637083;--card:#fff}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:#142033}.top{background:var(--navy);color:white;padding:18px 5%;display:flex;justify-content:space-between;gap:20px;align-items:center}.top a{color:white;text-decoration:none}.wrap{max-width:1180px;margin:30px auto;padding:0 20px}.hero{background:var(--navy);color:#fff;padding:28px;border-radius:18px;margin-bottom:18px}.hero h1{margin:8px 0;font-size:32px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}.stat{padding:15px;border:1px solid var(--line);border-radius:12px;background:#fff}.stat b{font-size:25px}.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 14px;cursor:pointer;text-decoration:none;color:#142033}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.field{display:flex;flex-direction:column;gap:6px}.field input,.field textarea{padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit}.field textarea{min-height:80px}.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#eaf1ff;color:#174a9c;font-size:12px}.ok{color:#16734a}.warn{color:#9a6100}.small{font-size:12px}.actions{margin-top:12px}
</style></head><body><script>
  const verde_api_token = localStorage.getItem('verde_api_token');
  const tm_user = JSON.parse(localStorage.getItem('tm_user') || 'null');
  if (!verde_api_token || !tm_user || (tm_user.role !== 'admin' && tm_user.role !== 'consultant')) {
    window.location.href = 'login.html';
  }
</script><header class="top"><b>TRYPHEN EMURUGAT — CLOSEOUT & OUTCOMES</b><div class="row"><a href="delivery.html">Delivery</a><a href="governance.html">Governance</a><a href="finance.html">Finance</a><a href="admin.html">Operations</a></div></header><main class="wrap"><div id="app"></div></main><script src="workflow-guards.js"></script>
<script src="project-state.js"></script><script src="engagement.js"></script><script src="closeout.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function render(){const p=TM.get(),e=TMENGAGEMENT.current(),c=TMCLOSEOUT.ensure(),open=c.outstanding.filter(x=>!x.done).length;const ready=c.acceptance.accepted&&open===0&&c.handover.completed;$('app').innerHTML=`<section class="hero"><span class="pill">${esc(c.status)}</span><h1>Close the project well. Capture what was achieved.</h1><p>Final acceptance, outstanding items, handover, outcomes and lessons are kept together so the engagement can move cleanly into Improve.</p><div class="row"><a class="btn" href="journey.html">Customer Journey</a><a class="btn" href="my-project.html">My Project</a></div></section><div class="grid"><div class="stat"><small>Acceptance</small><br><b>${c.acceptance.accepted?'Complete':'Pending'}</b></div><div class="stat"><small>Outstanding</small><br><b>${open}</b></div><div class="stat"><small>Handover</small><br><b>${c.handover.completed?'Complete':'Pending'}</b></div><div class="stat"><small>Archive readiness</small><br><b>${ready?'Ready':'Not ready'}</b></div></div><div class="card"><h2>Final acceptance</h2><p class="muted">Formal confirmation that the agreed delivery is accepted, subject only to recorded outstanding items.</p>${c.acceptance.accepted?`<p class="ok"><b>Accepted</b> by ${esc(c.acceptance.by)} on ${new Date(c.acceptance.date).toLocaleString()}</p><p>${esc(c.acceptance.notes)}</p>`:`<div class="field"><label>Approver</label><input id="approver" placeholder="Client approver"></div><div class="field"><label>Notes</label><textarea id="acceptNotes" placeholder="Acceptance notes"></textarea></div><div class="actions"><button class="btn primary" onclick="accept()">Record final acceptance</button><button class="btn" onclick="requestAcceptance()">Request acceptance</button></div>`}</div><div class="card"><h2>Outstanding items</h2>${c.outstanding.map(x=>`<div class="item"><b>${esc(x.text)}</b><div class="muted">Owner: ${esc(x.owner||'Unassigned')} · Due: ${esc(x.due||'Not set')} · ${x.done?'Complete':'Open'}</div>${!x.done?`<button class="btn" onclick="complete('${x.id}')">Mark complete</button>`:''}</div>`).join('')||'<p class="muted">No outstanding items.</p>'}<div class="grid"><div class="field"><label>Item</label><input id="ot" placeholder="e.g. final access transfer"></div><div class="field"><label>Owner</label><input id="oo" placeholder="Owner"></div><div class="field"><label>Due</label><input id="od" type="date"></div></div><button class="btn" onclick="addOut()">Add outstanding item</button></div><div class="card"><h2>Outcomes & benefits</h2>${c.outcomes.map(x=>`<div class="item"><b>${esc(x.text)}</b><div class="muted">Measure: ${esc(x.measure)} · Target: ${esc(x.target)}</div><div>Result: ${esc(x.result||'Not recorded')}</div></div>`).join('')||'<p class="muted">Record what changed or was achieved, not only what was delivered.</p>'}<div class="grid"><div class="field"><label>Outcome</label><input id="rt" placeholder="Outcome achieved"></div><div class="field"><label>Measure</label><input id="rm" placeholder="How it is measured"></div><div class="field"><label>Target</label><input id="rg" placeholder="Target or baseline"></div><div class="field"><label>Result</label><input id="rr" placeholder="Observed result"></div></div><button class="btn" onclick="addOutc()">Record outcome</button></div><div class="grid"><div class="card"><h2>Lessons learned</h2>${c.lessons.map(x=>`<div class="item"><b>${esc(x.text)}</b><div>${esc(x.action)}</div></div>`).join('')||'<p class="muted">No lessons recorded yet.</p>'}<div class="field"><label>Lesson</label><input id="lt" placeholder="What should we remember?"></div><div class="field"><label>Action</label><textarea id="la" placeholder="What will we do differently?"></textarea></div><button class="btn" onclick="lesson()">Add lesson</button></div><div class="card"><h2>Handover</h2><p class="muted">Capture the items transferred to the client or support team.</p>${c.handover.items.map(x=>`<div>✓ ${esc(x)}</div>`).join('')||'<p class="muted">No handover items yet.</p>'}<textarea id="hi" placeholder="One handover item per line"></textarea><button class="btn" onclick="handover()">Complete handover</button><hr><h3>Improve plan</h3>${c.improvement.actions.map(x=>`<div class="item"><b>${esc(x.text)}</b><div class="muted">${esc(x.owner)} · ${esc(x.due)} · ${esc(x.status)}</div></div>`).join('')||'<p class="muted">No improvement actions yet.</p>'}<div class="field"><input id="it" placeholder="Improvement action"></div><div class="grid"><input id="io" placeholder="Owner"><input id="idate" type="date"></div><button class="btn" onclick="improve()">Add to Improve plan</button></div></div><div class="card"><h2>Close & archive</h2><p class="muted">Recommended only after acceptance, outstanding work and handover are complete.</p>${c.archive.archived?'<p class="ok"><b>Closed and archived.</b> The project is ready for ongoing improvement governance.</p>':'<button class="btn primary" '+(ready?'':'disabled')+' onclick="archive()">Close and archive engagement</button>'}</div>`}
function accept(){TMCLOSEOUT.accept($('approver').value,$('acceptNotes').value);render()}function requestAcceptance(){TMCLOSEOUT.requestAcceptance();render()}function addOut(){if($('ot').value)TMCLOSEOUT.addOutstanding($('ot').value,$('oo').value,$('od').value);render()}function complete(id){TMCLOSEOUT.completeOutstanding(id);render()}function addOutc(){if($('rt').value)TMCLOSEOUT.addOutcome($('rt').value,$('rm').value,$('rg').value,$('rr').value);render()}function lesson(){if($('lt').value)TMCLOSEOUT.addLesson($('lt').value,$('la').value);render()}function handover(){TMCLOSEOUT.handover($('hi').value.split(/\n+/));render()}function improve(){if($('it').value)TMCLOSEOUT.addImprovement($('it').value,$('io').value,$('idate').value);render()}function archive(){TMCLOSEOUT.archive();if(TMENGAGEMENT.current())TMENGAGEMENT.transition(TMENGAGEMENT.current().id,'Completed');render()}render();</script></body></html>
