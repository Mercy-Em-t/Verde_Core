<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engagement | Tryphen Emurugat</title>
<style>body{margin:0;background:#f8fafc;color:#0b1325;font:14px/1.55 Inter,system-ui,sans-serif}.top{background:#0b1325;color:#fff;padding:20px}.wrap{max-width:1100px;margin:auto;padding:24px 18px}.card{background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}.primary{background:#0b1325;color:#fff}.pill{background:#eff6ff;color:#1e40af;border-radius:99px;padding:4px 9px}.muted{color:#64748b}.phase{border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin:10px 0}.bar{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#2563eb}.field{display:flex;flex-direction:column;gap:5px}.field input,.field textarea,.field select{padding:8px;border:1px solid #cbd5e1;border-radius:7px}.activity{border-left:2px solid #cbd5e1;padding-left:12px;margin:8px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><script>
  const verde_api_token = localStorage.getItem('verde_api_token');
  const tm_user = JSON.parse(localStorage.getItem('tm_user') || 'null');
  if (!verde_api_token || !tm_user || (tm_user.role !== 'admin' && tm_user.role !== 'consultant')) {
    window.location.href = 'login.html';
  }
</script><div class="top"><strong>TRYPHEN EMURUGAT — ENGAGEMENT & DELIVERY</strong><div style="opacity:.7">Sprint 10 · From approved proposal to governed delivery</div></div><main class="wrap"><div id="app"></div></main>
<script src="workflow-guards.js"></script>
<script src="project-state.js"></script><script src="engagement.js"></script><script src="proposal.js"></script><script>
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function ensure(){let e=TMENGAGEMENT.current(); if(!e){const p=TM.get(), prop=TMPROPOSAL.list().find(x=>x.id===p.proposalId)||TMPROPOSAL.list().find(x=>x.status==='Approved'); if(prop&&p.status==='Active project') e=TMENGAGEMENT.activateFromProposal(prop,p)} return e}
function render(){const e=ensure(); if(!e){$('app').innerHTML='<div class="card"><h1>No active engagement yet</h1><p class="muted">Approve a proposal and activate the project first.</p><button class="btn primary" onclick="location.href=\'proposal.html\'">Open Proposal Builder</button></div>';return} const done=e.phases.filter(x=>x.status==='Approved').length,total=e.phases.length||1,progress=Math.round(done/total*100);$('app').innerHTML=`<div class="row" style="justify-content:space-between"><div><h1>${esc(e.client)}</h1><span class="pill">${esc(e.status)}</span></div><div class="row"><button class="btn" onclick="location.href='journey.html'">Customer Journey</button><button class="btn" onclick="location.href='governance.html'">Client Governance</button><button class="btn" onclick="location.href='admin.html'">Operations</button><button class="btn" onclick="location.href='closeout.html'">Closeout</button></div></div><div class="card"><div class="grid"><div><b>Engagement</b><div>${esc(e.id)} · ${esc(e.proposalNumber)}</div><div class="muted">Owner: ${esc(e.owner||'Unassigned')}</div></div><div><b>Current action</b><div>${esc(e.nextAction)}</div><div class="bar" style="margin-top:8px"><i style="width:${progress}%"></i></div><div class="muted">${progress}% of phase gates approved</div></div></div></div><div class="card"><h2>Kickoff</h2><div class="grid"><div class="field"><label>Date / time</label><input id="kickoffDate" type="datetime-local" value="${esc(e.kickoff.date)}"></div><div class="field"><label>Notes</label><textarea id="kickoffNotes">${esc(e.kickoff.notes)}</textarea></div></div><button class="btn primary" onclick="kickoff('${e.id}')">${e.kickoff.scheduled?'Update kickoff':'Schedule kickoff'}</button></div><div class="card"><h2>Delivery phases</h2><p class="muted">Use Client Governance for document exchange, decisions, change requests, meetings and formal approvals.</p>${e.phases.map((p,i)=>`<div class="phase"><div class="row" style="justify-content:space-between"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.status)}${p.approvals.length?' · '+p.approvals.length+' approval(s)':''}</div></div><div class="row"><select id="st${p.phaseId}">${['Not started','In progress','Awaiting client approval','Approved','On hold'].map(s=>`<option ${s===p.status?'selected':''}>${s}</option>`).join('')}</select><button class="btn" onclick="updatePhase('${e.id}',${p.phaseId})">Save</button>${p.status==='Awaiting client approval'?`<button class="btn primary" onclick="approve('${e.id}',${p.phaseId})">Record approval</button>`:''}</div></div><h4>Deliverables</h4>${p.deliverables.map(d=>`<div>• ${esc(d.text)} <span class="muted">(${esc(d.status)})</span></div>`).join('')||'<div class="muted">No deliverables logged.</div>'}<div class="row" style="margin-top:8px"><input id="del${p.phaseId}" placeholder="Add deliverable"><button class="btn" onclick="deliverable('${e.id}',${p.phaseId})">Add</button></div><h4>Tasks</h4>${p.tasks.map(t=>`<div>• ${t.done?'✓':'○'} ${esc(t.text)} ${t.due?'<span class="muted">· '+esc(t.due)+'</span>':''} ${!t.done?`<button class="btn" onclick="taskDone('${e.id}',${p.phaseId},'${t.id}')">Complete</button>`:''}</div>`).join('')||'<div class="muted">No tasks.</div>'}<div class="row" style="margin-top:8px"><input id="task${p.phaseId}" placeholder="Add task"><input id="due${p.phaseId}" type="date"><button class="btn" onclick="taskAdd('${e.id}',${p.phaseId})">Add task</button></div></div>`).join('')}</div><div class="card"><h2>Activity</h2>${e.activity.slice().reverse().map(a=>`<div class="activity"><b>${esc(a.type)}</b> · ${new Date(a.at).toLocaleString()}<br>${esc(a.text)}</div>`).join('')}</div>`}
function kickoff(id){TMENGAGEMENT.scheduleKickoff(id,$('kickoffDate').value,$('kickoffNotes').value);syncProject();render()}function updatePhase(id,pid){TMENGAGEMENT.updatePhase(id,pid,$('st'+pid).value);syncProject();render()}function deliverable(id,pid){const v=$('del'+pid).value.trim();if(v)TMENGAGEMENT.updatePhase(id,pid,null,v);render()}function taskAdd(id,pid){const v=$('task'+pid).value.trim();if(v)TMENGAGEMENT.addTask(id,pid,v,$('due'+pid).value);render()}function taskDone(id,pid,tid){TMENGAGEMENT.completeTask(id,pid,tid);render()}function approve(id,pid){const n=prompt('Name of client approver:','Client approver');if(n!==null){TMENGAGEMENT.approvePhase(id,pid,n);syncProject();render()}}function syncProject(){const e=TMENGAGEMENT.current();if(!e)return;const p=TM.get();p.engagementId=e.id;p.status=e.status;p.nextAction=e.nextAction;p.currentPhaseId=e.currentPhaseId;p.history=p.history||[];p.history.push({at:new Date().toISOString(),type:'delivery-sync',engagementId:e.id,status:e.status});TM.save(p)}render();
</script></body></html>
