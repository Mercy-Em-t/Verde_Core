<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Project | Verde Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .sidebar { background-color: #1e293b; color: white; min-height: 100vh; }
    </style>
</head>
<body class="flex">

    <!-- Sidebar -->
    <aside class="sidebar w-64 p-6 hidden md:block">
        <div class="flex items-center space-x-3 mb-10">
            <i class="fa-solid fa-leaf text-green-400 text-2xl"></i>
            <span class="text-xl font-bold tracking-wider uppercase">Verde</span>
        </div>
        <nav class="space-y-4 text-sm font-medium">
            <a href="admin-dashboard.html" class="flex items-center space-x-3 text-slate-300 hover:text-white"><i class="fa-solid fa-chart-pie w-5"></i><span>Dashboard</span></a>
            <a href="admin-dashboard.html" class="flex items-center space-x-3 text-slate-300 hover:text-white"><i class="fa-solid fa-users w-5"></i><span>Leads & Clients</span></a>
            <a href="admin-dashboard.html" class="flex items-center space-x-3 text-white bg-slate-800 p-2 rounded"><i class="fa-solid fa-briefcase w-5"></i><span>Projects</span></a>
            <a href="admin-services.html" class="flex items-center space-x-3 text-slate-300 hover:text-white"><i class="fa-solid fa-layer-group w-5"></i><span>Services Hub</span></a>
            <a href="admin-portfolio.html" class="flex items-center space-x-3 text-slate-300 hover:text-white"><i class="fa-solid fa-images w-5"></i><span>Portfolio</span></a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8">
        <header class="flex justify-between items-center mb-8">
            <div>
                <a href="admin-dashboard.html" class="text-indigo-600 hover:underline text-sm font-bold"><i class="fa-solid fa-arrow-left mr-1"></i>Back to Projects</a>
                <h1 class="text-3xl font-bold text-slate-800 mt-2" id="projectTitle">Project Detail</h1>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Column: Phases -->
            <div class="lg:col-span-2 space-y-6">
                
                <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold">Commissioned Phases</h2>
                        
                        <div class="flex space-x-2">
                            <select id="phaseTemplate" class="border border-slate-300 rounded p-2 text-sm">
                                <option value="phase_2">Phase 2: Analysis</option>
                            </select>
                            <button onclick="commissionPhase()" class="bg-indigo-600 text-white px-4 py-2 rounded text-sm font-bold hover:bg-indigo-700">Commission</button>
                        </div>
                    </div>
                    
                    <div id="phasesList" class="space-y-4">
                        <div class="text-slate-500 text-sm">Loading phases...</div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Project Info -->
            <div class="space-y-6">
                <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200">
                    <h3 class="font-bold text-lg mb-4">Project Overview</h3>
                    <div class="space-y-3 text-sm">
                        <p><span class="text-slate-500">ID:</span> <span id="projectIdSpan" class="font-bold"></span></p>
                        <p><span class="text-slate-500">State:</span> <span id="projectState" class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-xs font-bold uppercase"></span></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="api-client.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');

        if (!projectId) {
            alert('No Project ID provided');
            window.location.href = 'admin-dashboard.html';
        }

        async function loadProjectDetails() {
            document.getElementById('projectIdSpan').innerText = projectId;
            
            // Load Phases
            try {
                const res = await window.TMAPI.adminDashboard('projects');
                const p = res.data.find(r => r[0] == projectId);
                if (p) {
                    document.getElementById('projectTitle').innerText = "Project " + p[0];
                    document.getElementById('projectState').innerText = p[3];
                }

                const phasesRes = await fetch(`http://127.0.0.1:8081/api/projects/${projectId}/phases`, {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('verde_api_token') }
                });
                if (phasesRes.ok) {
                    const data = await phasesRes.json();
                    renderPhases(data.phases);
                }
            } catch (e) {
                console.error(e);
            }
        }

        function renderPhases(phases) {
            const container = document.getElementById('phasesList');
            if (phases.length === 0) {
                container.innerHTML = '<div class="text-slate-500 text-sm">No phases commissioned yet.</div>';
                return;
            }

            container.innerHTML = phases.map(p => `
                <div class="border border-slate-200 rounded p-4">
                    <div class="flex justify-between items-center mb-2">
                        <h4 class="font-bold text-indigo-700">${p.name}</h4>
                        <span class="text-xs font-bold px-2 py-1 bg-slate-100 rounded uppercase">${p.status}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-4 mt-4">
                        <div>
                            <p class="text-xs font-bold text-slate-500 uppercase mb-2">Prerequisites</p>
                            <ul class="text-sm space-y-1">
                                ${p.prerequisites.map(req => `<li><i class="fa-solid fa-${req.completed ? 'check text-green-500' : 'xmark text-red-500'} mr-2"></i>${req.name}</li>`).join('')}
                            </ul>
                        </div>
                        <div>
                            <p class="text-xs font-bold text-slate-500 uppercase mb-2">Steps</p>
                            <ul class="text-sm space-y-1">
                                ${p.steps.map(step => `<li><i class="fa-solid fa-${step.completed ? 'check text-green-500' : 'clock text-amber-500'} mr-2"></i>${step.name}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function commissionPhase() {
            const template = document.getElementById('phaseTemplate').value;
            try {
                const res = await fetch(`http://127.0.0.1:8081/api/admin/projects/${projectId}/phases/commission`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('verde_api_token')
                    },
                    body: JSON.stringify({ template_id: template })
                });
                if (res.ok) {
                    loadProjectDetails();
                } else {
                    const error = await res.json();
                    alert("Error: " + error.detail);
                }
            } catch (e) {
                console.error(e);
            }
        }

        loadProjectDetails();
    </script>
</body>
</html>
