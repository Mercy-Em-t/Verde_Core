<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Governance | Tryphen Emurugat</title>
<style>body{margin:0;background:#f8fafc;color:#0b1325;font:14px/1.55 Inter,system-ui,sans-serif}.top{background:#0b1325;color:#fff;padding:20px}.wrap{max-width:1150px;margin:auto;padding:24px 18px}.card{background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}.primary{background:#0b1325;color:#fff}.pill{background:#eff6ff;color:#1e40af;border-radius:99px;padding:4px 9px}.muted{color:#64748b}.field{display:flex;flex-direction:column;gap:5px}.field input,.field textarea,.field select{padding:8px;border:1px solid #cbd5e1;border-radius:7px}.item{padding:12px 0;border-bottom:1px solid #e2e8f0}.item:last-child{border-bottom:0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button.active{background:#0b1325;color:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><script>
  const verde_api_token = localStorage.getItem('verde_api_token');
  const tm_user = JSON.parse(localStorage.getItem('tm_user') || 'null');
  if (!verde_api_token || !tm_user || (tm_user.role !== 'admin' && tm_user.role !== 'consultant')) {
    window.location.href = 'login.html';
  }
</script><div class="top"><strong>TRYPHEN EMURUGAT — CLIENT COLLABORATION & GOVERNANCE</strong><div style="opacity:.7">Sprint 11 · Decisions, documents, meetings, approvals and change control</div></div><main class="wrap"><div id="app"></div></main>
<script src="workflow-guards.js"></script>
<script src="project-state.js"></script><script src="engagement.js"></script><script src="governance.js"></script><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let tab='changeEngine';
function render(){const g=TMGOV.current();const e=TMENGAGEMENT.current();$('app').innerHTML=`<div class="row" style="justify-content:space-between"><div><h1>Project collaboration</h1><span class="pill">${esc(e?e.status:'Active project')}</span></div><div class="row"><button class="btn" onclick="location.href='journey.html'">Journey</button><button class="btn" onclick="location.href='delivery.html'">Delivery</button><button class="btn" onclick="location.href='admin.html'">Operations</button></div></div><div class="card"><div class="tabs">${['overview','changeEngine','documents','decisions','changes','meetings','approvals'].map(x=>`<button class="btn ${tab===x?'active':''}" onclick="tab='${x}';render()">${x==='changeEngine'?'Scope Change Engine':(x[0].toUpperCase()+x.slice(1))}</button>`).join('')}</div></div>${view(tab,g,e)}`}
function view(t,g,e){if(t==='overview')return `<div class="grid"><div class="card"><h2>What happens here</h2><p>Keep project decisions, client reviews, documents, meeting outcomes and changes in one traceable place.</p><p class="muted">This is the shared governance record. Internal notes should remain in the operations console.</p></div><div class="card"><h2>Current delivery</h2><p><b>${esc(e?.client||TM.get().name)}</b></p><p>${esc(e?.nextAction||TM.get().nextAction||'No next action recorded.')}</p><p>Documents ${g.documents.length} · Decisions ${g.decisions.length} · Changes ${g.changeRequests.length} · Meetings ${g.meetings.length}</p></div></div>`;
if(t==='changeEngine')return `<div class="card"><h2>Step 1: Triage & Classify Request</h2><div class="grid"><div class="field"><label>Client Request Description</label><textarea id="ceReq"></textarea></div><div class="field"><label>Classification</label><select id="ceClass" onchange="document.getElementById('ceDetails').style.display=this.value==='A'?'none':'block'; document.getElementById('ceDefect').style.display=this.value==='A'?'block':'none';"><option value="B">Class B: Scope Alteration (Billable)</option><option value="A">Class A: Defect / Non-Compliance (Zero-Cost)</option></select></div></div><div id="ceDefect" style="display:none;margin-top:16px;padding:12px;background:#EFF6FF;border:1px solid #93C5FD;border-radius:8px"><strong>Defect Rectification (Warranty)</strong><p>Covered under subcontractor's Defect Rectification Clause. Fix within 48-72 hours.</p><button class="btn primary" onclick="alert('Subcontractor Work Order Amendment Generated!')">Issue Defect WO to Dev</button></div><div id="ceDetails"><h2 style="margin-top:24px">Step 2: Change Impact & Commercial Estimation</h2><div class="grid"><div class="field"><label>Analysis & Modeling Hours</label><input type="number" id="ceH1" value="0"></div><div class="field"><label>Architecture & UI Hours</label><input type="number" id="ceH2" value="0"></div><div class="field"><label>Engineering & QA Hours</label><input type="number" id="ceH3" value="0"></div><div class="field"><label>Delivery Management Hours</label><input type="number" id="ceH4" value="0"></div></div><button class="btn primary" onclick="calcCE()">Calculate Quote</button><div id="ceQuote" style="margin-top:16px;padding:16px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;display:none"></div><h2 style="margin-top:24px">The Script: How to Communicate Changes</h2><div style="background:#F1F5F9;padding:16px;border-left:4px solid #3B82F6;border-radius:4px;font-style:italic">"That is an excellent operational feature... I will have our technical analyst run this through our Change Impact Assessment today... You can then decide whether you want us to incorporate it into this build, or hold it in our backlog for Phase 5 continuous enhancement after go-live."</div></div></div>`;
if(t==='documents')return `<div class="card"><h2>Document exchange</h2><div class="grid"><div class="field"><label>Document name</label><input id="dn"></div><div class="field"><label>Type</label><select id="dt"><option>Client input</option><option>Deliverable</option><option>Reference</option><option>Approval record</option></select></div><div class="field"><label>Description</label><textarea id="dd"></textarea></div><div class="field"><label>Status</label><select id="ds"><option>Shared</option><option>Needs client review</option><option>Accepted</option><option>Superseded</option></select></div></div><button class="btn primary" onclick="addDoc()">Add document record</button>${g.documents.map(d=>`<div class="item"><b>${esc(d.name)}</b> <span class="pill">${esc(d.status)}</span><div class="muted">${esc(d.type)} · ${new Date(d.created).toLocaleString()}</div><div>${esc(d.description)}</div></div>`).join('')||'<p class="muted">No documents recorded.</p>'}</div>`;
if(t==='decisions')return `<div class="card"><h2>Decision register</h2><div class="grid"><div class="field"><label>Decision / question</label><input id="decTitle"></div><div class="field"><label>Owner</label><input id="decOwner"></div><div class="field"><label>Due</label><input id="decDue" type="date"></div><div class="field"><label>Notes</label><textarea id="decNotes"></textarea></div></div><button class="btn primary" onclick="addDec()">Log decision</button>${g.decisions.map(d=>`<div class="item"><b>${esc(d.title)}</b> <span class="pill">${esc(d.status)}</span><div class="muted">Owner: ${esc(d.owner)} · Due: ${esc(d.due||'—')}</div><div>${esc(d.notes)}</div><select onchange="TMGOV.updateDecision('${d.id}',this.value);render()"><option ${d.status==='Open'?'selected':''}>Open</option><option ${d.status==='Agreed'?'selected':''}>Agreed</option><option ${d.status==='Deferred'?'selected':''}>Deferred</option><option ${d.status==='Closed'?'selected':''}>Closed</option></select></div>`).join('')||'<p class="muted">No decisions recorded.</p>'}</div>`;
if(t==='changes')return `<div class="card"><h2>Change requests</h2><div class="grid"><div class="field"><label>Requested change</label><input id="crTitle"></div><div class="field"><label>Requested by</label><input id="crBy"></div><div class="field"><label>Reason</label><textarea id="crReason"></textarea></div><div class="field"><label>Expected impact</label><textarea id="crImpact"></textarea></div></div><button class="btn primary" onclick="addCR()">Submit change request</button>${g.changeRequests.map(c=>`<div class="item"><b>${esc(c.title)}</b> <span class="pill">${esc(c.status)}</span><div>By ${esc(c.requestedBy)} · ${new Date(c.created).toLocaleString()}</div><div>${esc(c.reason)}</div><div class="muted">Impact: ${esc(c.impact)}</div><select onchange="TMGOV.updateChange('${c.id}',this.value);render()"><option>Submitted</option><option>Under review</option><option>Approved</option><option>Declined</option><option>Implemented</option></select></div>`).join('')||'<p class="muted">No change requests.</p>'}</div>`;
if(t==='meetings')return `<div class="card"><h2>Meeting records</h2><div class="grid"><div class="field"><label>Meeting</label><input id="mtTitle"></div><div class="field"><label>Date / time</label><input id="mtDate" type="datetime-local"></div><div class="field"><label>Attendees</label><input id="mtAtt"></div><div class="field"><label>Notes</label><textarea id="mtNotes"></textarea></div><div class="field"><label>Next actions</label><textarea id="mtNext"></textarea></div></div><button class="btn primary" onclick="addMt()">Record meeting</button>${g.meetings.map(m=>`<div class="item"><b>${esc(m.title)}</b><div class="muted">${esc(m.date)} · ${esc(m.attendees)}</div><div>${esc(m.notes)}</div><div><b>Next:</b> ${esc(m.nextActions)}</div></div>`).join('')||'<p class="muted">No meetings recorded.</p>'}</div>`;
return `<div class="card"><h2>Approvals & phase sign-offs</h2><div class="grid"><div class="field"><label>Approval type</label><select id="apType"><option>Deliverable</option><option>Phase gate</option><option>Decision</option><option>Change request</option></select></div><div class="field"><label>Reference</label><input id="apRef"></div><div class="field"><label>Approver</label><input id="apName"></div><div class="field"><label>Comment</label><textarea id="apComment"></textarea></div></div><button class="btn primary" onclick="addAp()">Record approval</button>${g.approvals.map(a=>`<div class="item"><b>${esc(a.type)} — ${esc(a.reference)}</b><div class="muted">Approved by ${esc(a.approver)} · ${new Date(a.at).toLocaleString()}</div><div>${esc(a.comment)}</div></div>`).join('')||'<p class="muted">No approvals recorded.</p>'}</div>`}
function addDoc(){TMGOV.addDocument($('dt').value,$('dn').value.trim(),$('dd').value,$('ds').value);render()}function addDec(){TMGOV.addDecision($('decTitle').value.trim(),$('decOwner').value.trim(),$('decDue').value,$('decNotes').value);render()}function addCR(){TMGOV.addChange($('crTitle').value.trim(),$('crReason').value,$('crImpact').value,$('crBy').value.trim());render()}function addMt(){TMGOV.addMeeting($('mtTitle').value.trim(),$('mtDate').value,$('mtAtt').value,$('mtNotes').value,$('mtNext').value);render()}function addAp(){TMGOV.approve($('apType').value,$('apRef').value.trim(),$('apName').value.trim(),$('apComment').value);render()}
function calcCE(){
  const totalHrs = (parseInt($('ceH1').value)||0) + (parseInt($('ceH2').value)||0) + (parseInt($('ceH3').value)||0) + (parseInt($('ceH4').value)||0);
  const cost = totalHrs * 3500;
  const bill = totalHrs * 8000;
  const margin = bill - cost;
  $('ceQuote').innerHTML = `
    <strong>Total Billable Hours:</strong> ${totalHrs} Hours<br>
    <strong>Subcontractor Direct Cost:</strong> KES ${cost.toLocaleString()}<br>
    <strong>Client Billing Rate:</strong> KES ${bill.toLocaleString()}<br>
    <strong style="color:#10B981">Net Margin to Consultancy:</strong> KES ${margin.toLocaleString()} (${totalHrs>0? Math.round((margin/bill)*100):0}%)<br>
    <div style="margin-top:12px; display:flex; gap:8px;">
      <button class="btn primary" onclick="alert('Change Order Request (COR) Generated!')">Generate COR Document</button>
      <button class="btn" onclick="alert('Subcontractor Work Order Amendment Generated!')">Issue Back-to-Back WO</button>
    </div>
  `;
  $('ceQuote').style.display='block';
}
render();</script></body></html>
