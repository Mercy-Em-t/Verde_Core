name: Verde SDLC Engine CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-engine:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'

    - name: Run SDLC Core Test Suite
      run: node run-tests-node.js

  build-docker:
    runs-on: ubuntu-latest
    needs: test-engine
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build Docker Image
      run: docker build . --file Dockerfile --tag verde_sdlc:latest

    - name: Verify Docker Compose Configuration
      run: docker-compose config
